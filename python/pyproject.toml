# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ippo"
version = "0.1.0"
description = "Load data from the Ippo app into pandas tables."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
# Parquet export: pip install ".[parquet]"
parquet = ["pyarrow>=14"]

[tool.setuptools]
packages = ["ippo"]

[tool.ruff]
# Wider than the default 88: tables of column names read better on one line.
line-length = 110
