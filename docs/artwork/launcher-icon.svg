<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- Ippo's launcher icon, drawn for Ippo: steps climbing toward the
       rising sun, in three ridges that fade into the distance. On the
       108 x 108 grid of an Android adaptive icon; launchers show the
       middle 72 x 72, cut to their own shape. The same shapes are the
       vector layers in android/app/src/main/res/drawable/ic_launcher_*.xml;
       the mipmap PNGs for older Android are rendered from this file (see
       "Artwork" in docs/dependencies.md). -->
  <rect width="108" height="108" fill="#FFC9A0"/>
  <circle cx="62" cy="45" r="11.5" fill="#FFF8EA"/>
  <!-- Every ridge has the same rhythm: two steps, 26 wide and 6 high,
       their top corners a little rounded. -->
  <path d="M0,108 V58 H40 V53.8 Q40,52 41.8,52 H66 V47.8 Q66,46 67.8,46 H108 V108 Z" fill="#F0A48F"/>
  <path d="M0,108 V68 H30 V63.8 Q30,62 31.8,62 H56 V57.8 Q56,56 57.8,56 H108 V108 Z" fill="#C2697F"/>
  <path d="M0,108 V78 H22 V73.8 Q22,72 23.8,72 H48 V67.8 Q48,66 49.8,66 H108 V108 Z" fill="#5A2C5C"/>
</svg>
